spring:
  application:
    name: liberty-utils

  datasource:
    # development url
    url: jdbc:postgresql://${DB_DOMAIN:ezra-home.me}:${DB_PORT:50005}/${DB_NAME:liberty_utils_dev}?sslmode=prefer
    # url: jdbc:postgresql://${DB_DOMAIN}/${DB_NAME}?sslmode=require
    username: ${DB_USERNAME:liberty-utils-dev-user}
    password: ${DB_PASSWORD:liberty-utils-dev-pw}

    hikari:
      auto-commit: false
      idle-timeout: 300000  # 5 minutes
      max-lifetime: 600000

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db-changelog-master.yml

  jpa:
    show-sql: ${SHOW_SQL:true}
    open-in-view: false
    hibernate:
      ddl-auto: none

okta:
  oauth2:
    issuer: https://${OKTA_DOMAIN:okta.liberty-solutions.ezra-home.me}/oauth2/default
    client-id: ${OKTA_CLIENT_ID:0oat6tdsh8ELHj4il697}
    client-secret: ${OKTA_CLIENT_SECRET:XJCm8n1SBkVfAxbPaflZ9Z2sLAQPTTWKbUcDrDAFpDSAp131UMjQrh79m2s7ZIdt}
  client:
    org-url: https://${OKTA_DOMAIN:okta.liberty-solutions.ezra-home.me}
    token: ${OKTA_API_TOKEN:00dCYaYJlPo3RSn2SEYmnbqX91er87of6zjZA_21xt}

server:
  port: ${PORT:8080}
  error:
    include-message: always
